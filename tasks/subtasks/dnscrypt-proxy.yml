---
- name: Install dnscrypt-proxy for DoH support
  hosts: wg_vpn
  vars_files:
    - "../../vars/vars.yml"
  become: true

  tasks:
    - name: Install "dnscrypt-proxy" package for Debian/Ubuntu
      ansible.builtin.apt:
        name: dnscrypt-proxy
        update_cache: true
        state: present
      when: ansible_distribution in ["Debian", "Ubuntu"]

    - name: Install "dnscrypt-proxy" package RedHat/Alma/Amazon
      ansible.builtin.dnf:
        name: dnscrypt-proxy
        update_cache: true
        state: latest
      when: ansible_distribution in ["Fedora", "CentOS", "AlmaLinux"]

    - name: Create override directory if it does not exist for Debian/Ubuntu
      ansible.builtin.file:
        path: /etc/systemd/system/dnscrypt-proxy.socket.d
        state: directory
        mode: '0755'
      when: ansible_distribution in ["Debian", "Ubuntu"]

    - name: Copy over dnscrypt-proxy socket override
      template:
        src: ../../templates/dnscrypt-override.conf.j2
        dest: /etc/systemd/system/dnscrypt-proxy.socket.d/override.conf
        mode: u=rw,g=r,o=r
        owner: root
        group: root

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable dnscrypt-proxy
      ansible.builtin.systemd:
        name: dnscrypt-proxy.service
        enabled: true
        masked: no
        state: restarted
